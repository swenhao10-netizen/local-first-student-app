name: build-apk
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zhixing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # 每个分支一个预览版 Release，手机浏览器直接下 APK（覆盖上一次）
      - name: 发布预览 APK
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk zhixing-preview.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" zhixing-preview.apk --prerelease --target "$GITHUB_SHA" --title "预览版 $GITHUB_REF_NAME" --notes "分支 $GITHUB_REF_NAME 自动打包的测试版，提交 $GITHUB_SHA"
      # 推 v* 标签 = 正式发行版（设为最新发行版），说明取 release-notes/<标签>.md
      - name: 发布正式版 APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "zhixing-${GITHUB_REF_NAME}.apk"
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || echo "知行 ${GITHUB_REF_NAME}" > "$NOTES"
          gh release create "$GITHUB_REF_NAME" "zhixing-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --latest
